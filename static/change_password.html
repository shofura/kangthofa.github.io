<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ganti Password - MSISDN Checker</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c2230; --muted:#6b7385; --line:#e3e6ec; --accent:#2457d6; --bad:#b42318; --ok:#117a45; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12151c; --card:#1b2029; --text:#e8ebf2; --muted:#9099ad; --line:#2a3140; --accent:#6b93ff; --bad:#ff7b72; --ok:#4cc38a; --warn:#e3b341; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
  form { width:100%; max-width:380px; margin:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  p { margin:0 0 16px; color:var(--muted); font-size:14px; line-height:1.5; }
  .banner { background:rgba(154,103,0,.12); color:var(--warn); border:1px solid var(--warn); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:16px; line-height:1.5; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font-size:15px; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  ul { margin:10px 0 0; padding:0; list-style:none; font-size:13px; color:var(--muted); }
  li::before { content:"○ "; } li.ok { color:var(--ok); } li.ok::before { content:"● "; }
  button { width:100%; margin-top:20px; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:11px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.link { background:none; color:var(--accent); margin-top:8px; font-weight:500; font-size:14px; }
  #err { color:var(--bad); font-size:14px; margin-top:14px; min-height:18px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<form id="f">
  <h1>Ganti Password</h1>
  <div class="banner" id="forced" hidden>Anda login memakai password awal. <strong>Wajib mengganti password</strong> sebelum bisa memakai aplikasi.</div>
  <p id="sub">Masukkan password saat ini dan password baru.</p>
  <label for="cur">Password saat ini</label>
  <input id="cur" type="password" autocomplete="current-password" required autofocus>
  <label for="n1">Password baru</label>
  <input id="n1" type="password" autocomplete="new-password" required>
  <label for="n2">Ulangi password baru</label>
  <input id="n2" type="password" autocomplete="new-password" required>
  <ul id="rules">
    <li id="r1">Minimal 8 karakter</li>
    <li id="r2">Mengandung huruf dan angka</li>
    <li id="r3">Password baru dan ulangannya sama</li>
  </ul>
  <button id="b" type="submit">Simpan password</button>
  <button id="back" class="link" type="button" hidden>Batal</button>
  <button id="out" class="link" type="button">Logout</button>
  <div id="err"></div>
</form>
<script>
  const $ = id => document.getElementById(id);
  let forced = false;
  fetch('/api/session').then(r => {
    if (r.status === 401) return location.href = '/login?expired=1';
    return r.json();
  }).then(d => {
    if (!d) return;
    forced = d.must_change;
    $('forced').hidden = !forced; $('back').hidden = forced;
  });

  function rules() {
    const a = $('n1').value, b = $('n2').value;
    $('r1').className = a.length >= 8 ? 'ok' : '';
    $('r2').className = /[A-Za-z]/.test(a) && /\d/.test(a) ? 'ok' : '';
    $('r3').className = a && a === b ? 'ok' : '';
  }
  $('n1').oninput = $('n2').oninput = rules;

  $('f').onsubmit = async e => {
    e.preventDefault(); $('err').textContent = ''; $('b').disabled = true;
    try {
      const res = await fetch('/api/change-password', { method: 'POST', body: new URLSearchParams({
        current_password: $('cur').value, new_password: $('n1').value, confirm_password: $('n2').value }) });
      let d = {}; try { d = await res.json(); } catch (_) {}
      if (res.status === 401) return location.href = '/login?expired=1';
      if (!res.ok) throw new Error(d.detail || 'Gagal mengganti password (' + res.status + ')');
      location.href = '/';
    } catch (x) { $('err').textContent = x.message; $('b').disabled = false; }
  };
  $('back').onclick = () => location.href = '/';
  $('out').onclick = () => fetch('/api/logout', { method: 'POST' }).finally(() => location.href = '/login');
</script>
</body>
</html>
